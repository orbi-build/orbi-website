name: CI

on:
  push:
    branches:
      - beta
  pull_request:

# Issue #210: a newer run for the same branch cancels the older one, so a
# pushed fix never queues behind runs it supersedes
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  promotion-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROMOTION_BASE_REF: ${{ github.base_ref }}
      PROMOTION_HEAD_REF: ${{ github.head_ref }}
      PROMOTION_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      PROMOTION_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Check promotion source
        run: node scripts/check-promotion-source.mjs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Keep public/install.sh synced with the orbi repo
        # The homepage's one-line install downloads this file, so a stale copy
        # would install something other than the current orbi. Sync with
        # scripts/sync-install-sh.sh whenever the source script changes.
        run: |
          set -euo pipefail
          timeout 120s curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/orbi-build/orbi/main/install.sh \
            -o /tmp/orbi-install.sh
          diff -u /tmp/orbi-install.sh public/install.sh
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: timeout 300s npm ci
      # No apt step: the ubuntu-24.04 runner image already carries Chromium's system
      # libraries (it ships Google Chrome). `playwright install-deps` re-ran apt-get
      # update on every job and hung on the Azure Ubuntu mirror until the 300s
      # timeout (2026-10-08: two Deploy beta attempts and PR #913).
      - name: Install Chromium for browser smoke tests
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: timeout 300s npx playwright install chromium
      - name: Run unit tests
        run: timeout 300s npm test

      # Browser-driven layout regressions (hero scale, heading line boxes,
      # Cloud card overflow, footer overflow, blog step images). They live
      # in CI, not in the deploy gates: tests/test_landing.py:934 forbids
      # `playwright install` in deploy-production.yml, because a deploy gate
      # that owns design assertions rolled a correct build back three times
      # in one day on 2026-09-10.
      - name: Run browser layout tests
        run: timeout 600s npm run test:ui
      - name: Run landing and deployment contract tests
        # Issue #103: the deploy workflows run these contract tests; PR CI
        # must run the same check set or a contract violation ships green
        # and breaks the deploy after the merge (the beta outage instance).
        run: timeout 300s python3 -m unittest tests.test_landing -v
      - name: Run browser smoke tests
        run: timeout 300s npm run test:browser
