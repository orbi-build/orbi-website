name: CI

on:
  pull_request:

# Issue #210: a newer run for the same branch cancels the older one, so a
# pushed fix never queues behind runs it supersedes
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Keep public/install.sh synced with the orbi repo
        # The homepage's one-line install downloads this file, so a stale copy
        # would install something other than the current orbi. Sync with
        # scripts/sync-install-sh.sh whenever the source script changes.
        run: |
          set -euo pipefail
          timeout 120s curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/orbi-build/orbi/main/install.sh \
            -o /tmp/orbi-install.sh
          diff -u /tmp/orbi-install.sh public/install.sh
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: timeout 300s npm ci
      - name: Install Chromium system dependencies
        run: timeout 300s npx playwright install-deps chromium
      - name: Install Chromium for browser smoke tests
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: timeout 300s npx playwright install chromium
      - name: Run unit tests
        run: timeout 300s npm test
      - name: Run landing and deployment contract tests
        # Issue #103: the deploy workflows run these contract tests; PR CI
        # must run the same check set or a contract violation ships green
        # and breaks the deploy after the merge (the beta outage instance).
        run: timeout 300s python3 -m unittest tests.test_landing -v
      - name: Run browser smoke tests
        run: timeout 300s npm run test:browser
