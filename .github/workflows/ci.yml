name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: timeout 300s npm ci
      - name: Install Chromium for browser smoke tests
        run: timeout 300s npx playwright install --with-deps chromium
      - name: Run unit tests
        run: timeout 300s npm test
      - name: Run browser smoke tests
        run: timeout 300s npm run test:browser
