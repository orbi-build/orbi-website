name: Deploy beta

on:
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-beta
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record deployed source commit
        run: |
          echo "beta deploy source branch: ${GITHUB_REF_NAME}"
          echo "beta deploy source commit: $(git rev-parse HEAD)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Install dependencies
        run: timeout 300s npm ci

      - name: Run tests before deployment
        run: timeout 300s npm test

      - name: Run landing and deployment contract tests
        run: timeout 300s python3 -m unittest tests.test_landing -v

      - name: Install Chromium for browser smoke tests
        run: timeout 300s npx playwright install --with-deps chromium

      - name: Require Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is required for beta deployment"
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is required for beta deployment"
            exit 1
          fi

      - name: Deploy beta Worker and assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.34.0"
          command: deploy --env beta

      - name: Bind beta GitHub API token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ORBI_GITHUB_TOKEN: ${{ secrets.ORBI_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$ORBI_GITHUB_TOKEN" ]]; then
            echo "::error::ORBI_GITHUB_TOKEN secret is required for the beta /stats endpoint"
            exit 1
          fi
          printf '%s' "$ORBI_GITHUB_TOKEN" | timeout 120s npx wrangler@4.34.0 secret put GITHUB_TOKEN --env beta

      - name: Smoke-test beta deployment
        shell: bash
        run: |
          set -euo pipefail
          check_page() {
            local url="$1"
            local expected="$2"
            local body
            body="$(mktemp)"
            trap 'rm -f "$body"' RETURN
            echo "Smoke testing $url"
            timeout 60s curl --fail --silent --show-error --location --retry 2 --retry-delay 5 "$url" -o "$body"
            if ! grep -Fqi "$expected" "$body"; then
              echo "::error::${url} did not contain expected content: ${expected}"
              return 1
            fi
            echo "Smoke test passed: $url returned HTTP 200 and contains $expected"
          }
          check_page "https://beta.orbi.build/" "Turn GitHub Issues"
          check_page "https://beta.orbi.build/install.sh" "Install Orbi from its source checkout"
          check_page "https://beta.orbi.build/compare/" "OpenClaw"
          check_page "https://beta.orbi.build/compare/openclaw/" "OpenClaw"
          check_page "https://beta.orbi.build/zh/compare/openclaw/" "OpenClaw"
      - name: Smoke-test beta in a real browser
        run: timeout 300s env BASE_URL=https://beta.orbi.build npm run test:browser
