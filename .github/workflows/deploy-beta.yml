name: Deploy beta

on:
  workflow_run:
    # Issue #1301: this filter matches a promotion PR's CI run too — a
    # beta → main PR runs CI with head branch `beta` — so the upstream run's
    # own trigger event decides in scripts/beta-deploy-gate.mjs; only a push
    # to beta deploys.
    workflows:
      - CI
    types:
      - completed
    branches:
      - beta
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  require-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Decide whether this CI run deploys beta
        # Issue #1301: deploys only a push to beta whose CI passed. A
        # promotion PR's CI completion skips here, so the deploy job below
        # never starts.
        id: gate
        env:
          BETA_DEPLOY_EVENT: ${{ github.event_name }}
          BETA_DEPLOY_UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          BETA_DEPLOY_UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BETA_DEPLOY_UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: timeout 60s node scripts/beta-deploy-gate.mjs

      - name: Require successful CI for the dispatched commit
        # Only the manual path asks GitHub: the gate above already read the
        # conclusion of a workflow_run push.
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ci_run_id="$(timeout 120s gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --branch beta --commit "$TEST_SHA" --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -z "$ci_run_id" ]]; then
            echo "::error::No successful CI run found for beta commit $TEST_SHA"
            exit 1
          fi
          echo "Found successful CI run $ci_run_id for $TEST_SHA"

  deploy:
    needs: require-ci
    if: needs.require-ci.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Issue #1301: the group sits on the deploy job, not on the workflow. A run
    # whose deploy job is skipped (a promotion PR's CI completion) never starts
    # that job, so it never enters the group and never cancels a beta deploy
    # still running; a newer push still replaces an older deploy.
    concurrency:
      group: deploy-beta
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Record deployed source commit
        env:
          DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          echo "beta deploy source branch: ${DEPLOY_BRANCH:-$GITHUB_REF_NAME}"
          echo "beta deploy source commit: $(git rev-parse HEAD)"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: timeout 300s npm ci

      - name: Run landing and deployment contract tests
        run: timeout 300s python3 -m unittest tests.test_landing -v

      # No apt step: the ubuntu-24.04 runner image already carries Chromium's system

      # libraries (it ships Google Chrome). `playwright install-deps` re-ran apt-get

      # update on every job and hung on the Azure Ubuntu mirror until the 300s

      # timeout (2026-10-08: two Deploy beta attempts and PR #913).

      - name: Install Chromium for browser smoke tests
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: timeout 300s npx playwright install chromium

      - name: Require Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is required for beta deployment"
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is required for beta deployment"
            exit 1
          fi

      - name: Deploy beta Worker and assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.34.0"
          command: deploy --env beta

      - name: Bind beta GitHub API token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ORBI_GITHUB_TOKEN: ${{ secrets.ORBI_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$ORBI_GITHUB_TOKEN" ]]; then
            echo "::error::ORBI_GITHUB_TOKEN secret is required for the beta /stats endpoint"
            exit 1
          fi
          printf '%s' "$ORBI_GITHUB_TOKEN" | timeout 120s npx wrangler@4.34.0 secret put GITHUB_TOKEN --env beta

      - name: Warm the beta stats snapshot before the smoke test
        # Issue #917: /stats reads a KV snapshot the 5-minute cron writes, so a
        # fresh deploy can reach the smoke with KV still empty. One request to
        # /stats pulls GitHub and fills KV; poll until every repo is non-null,
        # so the smoke never races an empty snapshot. GitHub can be briefly
        # rate-limited, so a snapshot that stays incomplete warns instead of
        # reddening the deploy — the pages themselves are still up.
        shell: bash
        run: |
          set -euo pipefail
          url="https://beta.orbi.build/stats"
          for attempt in $(seq 1 12); do
            body="$(timeout 60s curl --fail --silent --show-error "$url" || true)"
            if [[ -n "$body" ]] && ! jq -e '[.repos[] | select(. == null)] | length > 0' <<<"$body" >/dev/null 2>&1; then
              echo "stats snapshot complete (attempt ${attempt})"
              exit 0
            fi
            echo "attempt ${attempt}: stats snapshot not ready; retrying in 10s"
            sleep 10
          done
          echo "::warning::stats snapshot was not ready within 120s; the homepage may render fallback numbers until the next cron run"

      - name: Smoke-test beta deployment
        shell: bash
        run: |
          set -euo pipefail
          # What this gate is for: the deployed URL answers at all. It does NOT
          # assert page copy — a wording change is not a deploy failure, and
          # asserting copy here only produces false reds (Issue #369 changed
          # both hero headlines; these assertions kept the old wording and
          # failed every beta deploy while the pages themselves were correct).
          # Content belongs in the repo's own tests, which run before deploy.
          #
          # `curl --fail` is the whole contract: it fails on any 4xx/5xx, and
          # on a redirect loop. That is what Issue #223 needed — /cloud (the
          # no-slash form shared on Telegram/X) answered 500 for an hour in
          # production on 2026-09-18, unseen by either smoke.
          check_page() {
            local url="$1"
            echo "Smoke testing $url"
            timeout 60s curl --fail --silent --show-error --location \
              --retry 2 --retry-delay 5 "$url" -o /dev/null
            echo "Smoke test passed: $url answered successfully"
          }
          check_page "https://beta.orbi.build/"
          check_page "https://beta.orbi.build/install.sh"
          check_page "https://beta.orbi.build/compare/"
          check_page "https://beta.orbi.build/compare/openclaw/"
          check_page "https://beta.orbi.build/zh/compare/openclaw/"
          check_page "https://beta.orbi.build/cloud/"
          check_page "https://beta.orbi.build/cloud"
      - name: Smoke-test beta in a real browser
        # Issue #74: the login contract is declared per environment, never
        # guessed in the test. Issue #76: the website hands off at its own
        # /cloud/login. Issue #570: that 302s to the Cloud control plane's
        # /api/login (docs/cloud-endpoints.md), which answers with GitHub's
        # OAuth authorize redirect, and the smoke follows both hops.
        run: timeout 300s env BASE_URL=https://beta.orbi.build CLOUD_LOGIN_EXPECT=github-app-302 npm run test:browser
