<!DOCTYPE html>
<html lang="{{LANG_ATTR}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
{{POST_META}}
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#06151b">

  <meta property="og:image" content="https://orbi.build/img/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{{FONT_LINK}}
  <link rel="stylesheet" href="/styles.css">

  <style>
    /* Post template: the CommonMark body rendered from content/blog/*.md. */
    .post-body { max-width: 52rem; margin: 0 auto; padding: 12px 24px 30px; }
    .post-body h2 { font-family: var(--display); font-size: 1.5rem; line-height: 1.25; margin: 42px 0 10px; }
    .post-body h3 { font-family: var(--display); font-size: 1.13rem; line-height: 1.3; margin: 30px 0 6px; }
    .post-body p { margin: 14px 0; }
    .post-body ul, .post-body ol { margin: 14px 0; padding-left: 22px; }
    .post-body li { margin: 6px 0; }
    .post-body a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    .post-body code { font-family: var(--mono); font-size: 0.88em; background: var(--paper-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
    .post-body pre { background: var(--paper-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; overflow-x: auto; margin: 18px 0; }
    .post-body pre code { background: none; border: none; padding: 0; font-size: 0.85rem; }
    .post-body strong { font-weight: 600; }
  </style>

  <script defer data-website-id="dfid_Pi7Ns3F360oaZZcmnZgV4" data-domain="orbi.build" src="https://datafa.st/js/script.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">{{SKIP_LABEL}}</a>

{{NAV}}

  <main id="main-content">
    <div class="night">
      <section class="compare-hero shell" aria-labelledby="post-title">
        <p class="eyebrow">{{EYEBROW}} · {{DATE}}</p>
        <h1 id="post-title">{{HEADLINE}}</h1>
        <p class="hero-lede">{{SUMMARY}}</p>
      </section>
    </div>

    <article class="post-body">
{{BODY}}
    </article>
  </main>

{{FOOTER}}

  <script src="/demo.js" defer></script>
  <!-- Cloudflare Web Analytics: privacy-first, no cookies, no consent banner.
       The account's auto-install does not reach this site because the pages
       are served by the Worker's asset binding, not proxied HTML. -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "44c2c3310e2e46b7955bb09f04c93fd1"}'></script>
</body>
</html>
