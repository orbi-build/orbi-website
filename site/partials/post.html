<!DOCTYPE html>
<html lang="{{LANG_ATTR}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
{{POST_META}}
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#06151b">

  <meta property="og:image" content="https://orbi.build/img/og.png">
  <meta name="twitter:card" content="summary_large_image">
{{FONT_LINK}}
  <link rel="stylesheet" href="/styles.css">

  <style>
    /* Blog-only layout: the shared .shell/.compare-hero rules stay unchanged. */
    .post-grid { display: grid; grid-template-columns: 232px minmax(0, 52rem); column-gap: 24px; max-width: 68rem; margin: 0 auto; }
    .post-hero { grid-column: 2; padding: 84px 24px 68px; }
    .post-hero h1 { max-width: none; }
    .post-body { grid-column: 2; max-width: none; margin: 0; padding: 12px 24px 30px; }
    .post-body h2 { font-family: var(--display); font-size: 1.5rem; line-height: 1.25; margin: 42px 0 10px; scroll-margin-top: 24px; }
    .post-body h3 { font-family: var(--display); font-size: 1.13rem; line-height: 1.3; margin: 30px 0 6px; }
    .post-body p { margin: 14px 0; }
    .post-body ul, .post-body ol { margin: 14px 0; padding-left: 22px; }
    .post-body li { margin: 6px 0; }
    .post-body a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    .post-body code { font-family: var(--mono); font-size: 0.88em; background: var(--paper-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; white-space: nowrap; overflow-wrap: anywhere; }
    .post-body code.post-code--spaced { white-space: normal; }
    .post-body pre { background: var(--paper-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; overflow-x: auto; margin: 18px 0; }
    .post-body pre code, .post-body pre code.post-code--spaced, .post-body pre code.post-code--single { background: none; border: none; padding: 0; font-size: 0.85rem; white-space: pre; overflow-wrap: normal; }
    .post-table-scroll { overflow-x: auto; }
    .post-body table { width: 100%; border-collapse: collapse; }
    .post-body th, .post-body td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; }
    .post-body th { background: var(--paper-2); }
    .post-body strong { font-weight: 600; }
    .post-media { margin: 24px 0; }
    .post-body svg { max-width: 100%; height: auto; }
    .post-media img, .post-media iframe, .post-media svg { display: block; width: 100%; border: 0; border-radius: 10px; }
    .post-media img, .post-media svg { height: auto; }
    .post-media iframe { aspect-ratio: 16 / 9; }
    .post-media figcaption { color: var(--muted); font-size: 0.9rem; margin-top: 8px; }
    .post-toc { grid-column: 1; grid-row: 1; position: sticky; top: 24px; align-self: start; max-height: calc(100vh - 48px); overflow-y: auto; margin-top: 12px; padding: 12px 0 12px 16px; border-left: 2px solid var(--line); }
    .post-toc p { margin: 0 0 8px; font-weight: 600; }
    .post-toc ol { margin: 0; padding: 0; list-style: none; }
    .post-toc li { margin: 0; }
    .post-toc a { display: block; padding: 4px 0; color: var(--ink-soft); text-decoration: none; overflow-wrap: anywhere; }
    .post-toc a:hover, .post-toc a.is-active { color: var(--ink); font-weight: 600; }
    .post-toc a.is-active { border-left: 3px solid var(--signal); margin-left: -18px; padding-left: 15px; }
    .post-toc-inline { display: none; margin: 0 0 28px; border: 1px solid var(--line); }
    .post-toc-inline summary { cursor: pointer; padding: 10px 12px; font-weight: 600; }
    .post-toc-inline ol { margin: 0; padding: 0 12px 10px 34px; }
    .post-toc-inline a { overflow-wrap: anywhere; }
    @media (max-width: 1199px) {
      .post-grid { display: block; width: min(52rem, calc(100% - 48px)); }
      .post-hero, .post-body { padding-left: 0; padding-right: 0; }
      .post-hero { padding-top: 64px; padding-bottom: 48px; }
      .post-toc { display: none; }
      .post-toc-inline { display: block; }
    }
  </style>

</head>
<body>
  <a class="skip-link" href="#main-content">{{SKIP_LABEL}}</a>

{{NAV}}

  <main id="main-content">
    <div class="night">
      <div class="post-grid">
        <section class="post-hero" aria-labelledby="post-title">
          <p class="eyebrow">{{EYEBROW}} · {{DATE}}</p>
          <h1 id="post-title">{{HEADLINE}}</h1>
          <p class="hero-lede">{{SUMMARY}}</p>
        </section>
      </div>
    </div>

    <div class="post-grid">
{{DESKTOP_TOC}}
      <article class="post-body">
{{INLINE_TOC}}
{{BODY}}
      </article>
    </div>
  </main>

{{FOOTER}}

  <script src="/demo.js" defer></script>

</body>
</html>
