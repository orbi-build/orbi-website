<!DOCTYPE html>
<html lang="{{LANG_ATTR}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
{{POST_META}}
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#06151b">

  <meta property="og:image" content="https://orbi.build/img/og.png">
  <meta name="twitter:card" content="summary_large_image">
{{FONT_LINK}}
  <link rel="stylesheet" href="/styles.css">

  <style>
    /* Blog-only layout: the shared .shell/.compare-hero rules stay unchanged. */
    .post-grid { max-width: 52rem; margin: 0 auto; padding: 0 24px; }
    .post-hero { padding: 84px 0 68px; }
    .post-body { padding-top: 12px; padding-bottom: 30px; }
    .post-body h2, .post-body .related-links h2 { font-family: var(--display); font-size: 1.5rem; line-height: 1.25; margin: 42px 0 10px; scroll-margin-top: 24px; }
    .post-body .related-links { margin: 0; }
    .post-cta {
      margin: 42px 0 12px;
      padding: 30px;
      border-radius: var(--radius-card);
      background: var(--night);
      color: #edf5f0;
      text-align: center;
    }
    .post-cta h2 { margin: 0 0 18px; color: #edf5f0; font-family: var(--display); font-size: 1.5rem; line-height: 1.25; }
    .post-cta .button { margin: 0 auto; color: var(--night); text-decoration: none; }
    .post-cta-note { margin: 10px 0 18px; color: #aec2bd; font-size: 0.9rem; }
    .post-cta .post-cta-link { color: #edf5f0; font-size: 0.9rem; text-underline-offset: 3px; }
    .post-cta .post-cta-link:hover { color: #fff; }
    .post-cta-inline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 28px 0;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      background: var(--paper-2);
    }
    .post-cta-inline span { color: var(--ink); font-size: 0.95rem; }
    .post-cta-inline .button { flex: 0 0 auto; min-height: 40px; padding: 0 14px; font-size: 0.85rem; }
    .post-toc { position: sticky; top: 24px; max-height: calc(100vh - 48px); overflow-y: auto; align-self: start; }
    .post-toc h2 { margin: 0 0 12px; font-size: 0.95rem; font-weight: 600; }
    .post-toc ol, .post-body .post-toc-inline ol { margin: 0; padding-left: 2.2em; }
    .post-toc li, .post-toc-inline li { margin: 6px 0; }
    .post-toc-link { display: block; color: var(--ink-soft); font-size: 0.92rem; line-height: 1.4; text-decoration: none; overflow-wrap: anywhere; }
    .post-toc-link:hover, .post-toc-link.is-current { color: var(--ink); }
    .post-toc-link.is-current { border-left: 3px solid var(--signal-on-light); font-weight: 600; margin-left: -3px; padding-left: 8px; }
    .post-toc-inline { display: none; margin: 0 0 28px; border: 1px solid var(--line); border-radius: var(--radius-card); padding: 12px 16px; }
    .post-toc-inline summary { cursor: pointer; font-weight: 600; }
    .post-toc-inline ol { margin-top: 12px; }

    .post-body h3 { font-family: var(--display); font-size: 1.13rem; line-height: 1.3; margin: 30px 0 6px; }
    .post-body p { margin: 14px 0; }
    .post-body ul, .post-body ol { margin: 14px 0; padding-left: 22px; }
    .post-body li { margin: 6px 0; }
    .post-body a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    .post-body code { font-family: var(--mono); font-size: 0.88em; background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--radius-control); padding: 1px 5px; white-space: nowrap; overflow-wrap: anywhere; }
    .post-body code.post-code--spaced { white-space: normal; }
    .post-body pre { background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--radius-card); padding: 14px 16px; overflow-x: auto; margin: 18px 0; }
    .post-body pre code, .post-body pre code.post-code--spaced, .post-body pre code.post-code--single { background: none; border: none; padding: 0; font-size: 0.85rem; white-space: pre; overflow-wrap: normal; }
    .post-table-scroll { overflow-x: auto; }
    .post-body table { width: 100%; border-collapse: collapse; }
    .post-body th, .post-body td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; }
    .post-body th { background: var(--paper-2); }
    .post-body strong { font-weight: 600; }
    .post-media { margin: 24px 0; }
    .post-body svg { max-width: 100%; height: auto; }
    .post-media img, .post-media iframe, .post-media svg { display: block; width: 100%; border: 0; border-radius: var(--radius-card); }
    .post-media img, .post-media svg { height: auto; }
    .post-media iframe { aspect-ratio: 16 / 9; }
    .post-media figcaption { color: var(--muted); font-size: 0.9rem; margin-top: 8px; }
    @media (min-width: 1200px) {
      .post-grid { display: grid; grid-template-columns: 232px minmax(0, 52rem); column-gap: 24px; max-width: 68rem; padding: 0; }
      .post-hero, .post-body { grid-column: 2; padding-left: 24px; padding-right: 24px; }
    }
    @media (max-width: 1199px) {
      .post-toc { display: none; }
      .post-toc-inline { display: block; }
    }
    @media (max-width: 760px) {
      .post-hero { padding-top: 64px; padding-bottom: 48px; }
      .post-cta { padding: 24px 18px; }
      .post-cta .button { width: 100%; }
      .post-cta-inline { align-items: stretch; flex-direction: column; gap: 10px; }
      .post-cta-inline .button { width: 100%; }
    }
  </style>

</head>
<body>
  <a class="skip-link" href="#main-content">{{SKIP_LABEL}}</a>

{{NAV}}

  <main id="main-content">
    <div class="night">
      <div class="post-grid">
        <section class="post-hero" aria-labelledby="post-title">
          <p class="eyebrow">{{EYEBROW}} · {{DATE}}</p>
          <h1 id="post-title">{{HEADLINE}}</h1>
          <p class="hero-lede">{{SUMMARY}}</p>
        </section>
      </div>
    </div>

    <div class="post-grid">
{{POST_TOC}}
      <article class="post-body">
{{INLINE_TOC}}
{{BODY}}
{{RELATED_MARKER}}
      </article>
    </div>
  </main>

{{FOOTER}}

  <script src="/demo.js" defer></script>

</body>
</html>
