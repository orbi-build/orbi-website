<!DOCTYPE html>
<html lang="{{LANG_ATTR}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{CANONICAL}}">
  <link rel="alternate" hreflang="en" href="{{HREFLANG_EN}}">
  <link rel="alternate" hreflang="zh-CN" href="{{HREFLANG_ZH}}">
  <link rel="alternate" hreflang="x-default" href="{{HREFLANG_XDEFAULT}}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#06151b">

  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Orbi">
  <meta property="og:locale" content="{{OG_LOCALE}}">
  <meta property="og:locale:alternate" content="{{OG_LOCALE_ALT}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:image" content="https://orbi.build/img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{TITLE}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@xqliu">
  <meta name="twitter:creator" content="@xqliu">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="https://orbi.build/img/og.png">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/styles.css">

  <style>
    /* Guide-only body layout: the shared .shell/.compare-hero rules stay unchanged. */
    .guide-grid { max-width: 52rem; margin: 0 auto; padding: 0 24px; }
    /* Issue #860: the guide hero takes the blog hero's shape — it sits in
       .guide-grid and, at wide viewports, shares .guide-body's column and
       gutters, so its h1/lede edges land on the body text instead of the wider
       68rem .compare-hero frame. The padding is the value the shared
       .compare-hero + breadcrumb rules produced for this hero. */
    .guide-hero { position: relative; z-index: 1; padding: 32px 0 68px; }
    .guide-hero h1, .guide-hero .hero-lede { max-width: none; }
    .guide-body { padding-top: 12px; padding-bottom: 60px; }
    .guide-body h2 { font-family: var(--display); font-size: 1.5rem; line-height: 1.25; margin: 42px 0 10px; scroll-margin-top: 24px; }
    .guide-body h3 { font-family: var(--display); font-size: 1.13rem; line-height: 1.3; margin: 30px 0 6px; }
    .guide-body p { margin: 14px 0; }
    .guide-body ul, .guide-body ol { margin: 14px 0; padding-left: 22px; }
    .guide-body li { margin: 6px 0; }
    .guide-body a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    .guide-body code { font-family: var(--mono); font-size: 0.88em; background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--radius-control); padding: 1px 5px; white-space: nowrap; overflow-wrap: anywhere; }
    .guide-body code.post-code--spaced { white-space: normal; }
    .guide-body pre { background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--radius-card); padding: 14px 16px; overflow-x: auto; margin: 18px 0; }
    .guide-body pre code, .guide-body pre code.post-code--spaced, .guide-body pre code.post-code--single { background: none; border: none; padding: 0; font-size: 0.85rem; white-space: pre; overflow-wrap: normal; }
    .guide-body table { width: 100%; border-collapse: collapse; }
    .guide-body th, .guide-body td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; }
    .guide-body th { background: var(--paper-2); }
    .guide-body .post-table-scroll { overflow-x: auto; }
    .guide-body .series-list { margin: 14px 0; padding-left: 22px; }
    .guide-body .series-list time { color: var(--ink-soft); font-size: 0.9rem; }

    /* The On this page TOC is the blog TOC (Issue #835): the same rules as
       post.html, scoped to the guide body, so the two stay one component. */
    .post-toc { position: sticky; top: 24px; max-height: calc(100vh - 48px); overflow-y: auto; align-self: start; padding-top: 26px; }
    .post-toc h2 { margin: 0 0 10px; padding: 0; font: 500 0.75rem/1.5rem var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
    .post-toc ol { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--line); }
    .post-toc ol ol { border-left: 0; }
    .guide-body .post-toc-inline ol { margin: 0; padding-left: 2.2em; }
    .guide-body .post-toc-inline ol ol { list-style: none; padding-left: 1em; margin-top: 0; }
    .post-toc li { margin: 0; }
    .post-toc-inline li { margin: 6px 0; }
    .post-toc-link { display: block; color: var(--ink-soft); font-size: 0.92rem; line-height: 1.4; text-decoration: none; overflow-wrap: anywhere; }
    .post-toc .post-toc-link { padding: 6px 0 6px 15px; margin-left: -1px; border-left: 1px solid transparent; font-size: 0.875rem; line-height: 1.25rem; }
    .post-toc ol ol .post-toc-link { padding-left: 27px; }
    .post-toc-link:hover, .post-toc-link.is-current { color: var(--ink); }
    .post-toc .post-toc-link.is-current { border-left-color: var(--ink); color: var(--ink); font-weight: 600; }
    .post-toc-inline { display: none; margin: 0 0 28px; border: 1px solid var(--line); border-radius: var(--radius-card); padding: 12px 16px; }
    .post-toc-inline summary { cursor: pointer; font-weight: 600; }
    .post-toc-inline ol { margin-top: 12px; }

    @media (min-width: 1200px) {
      .guide-grid { display: grid; grid-template-columns: minmax(0, 52rem) 200px; column-gap: 56px; max-width: calc(52rem + 256px); padding: 0; }
      .guide-hero, .guide-body { grid-column: 1; padding-left: 16px; padding-right: 16px; }
      .post-toc { grid-column: 2; grid-row: 1; }
    }
    @media (max-width: 760px) {
      .guide-hero { padding-bottom: 48px; }
    }
    @media (max-width: 640px) {
      .guide-hero { padding-top: 24px; }
    }
    @media (max-width: 1199px) {
      .post-toc { display: none; }
      .post-toc-inline { display: block; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">{{SKIP_LABEL}}</a>

{{NAV}}

  <main id="main-content">
    <div class="night">{{BREADCRUMB}}
      <div class="guide-grid">
        <section class="guide-hero" aria-labelledby="guide-title">
          <p class="eyebrow">{{EYEBROW}}</p>
          <h1 id="guide-title">{{HEADLINE}}</h1>
          <p class="hero-lede">{{SUMMARY}}</p>
        </section>
      </div>
    </div>

    <div class="guide-grid">
{{TOC}}
      <article class="guide-body">
{{INLINE_TOC}}
{{BODY}}
      </article>
    </div>

{{RELATED_LINKS}}
  </main>

{{FOOTER}}

  <script src="/demo.js" defer></script>

</body>
</html>
