<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="t d">
  <title id="t">Orbi delivery flow</title>
  <desc id="d">A GitHub Issue is claimed, implemented in a worktree, tested, independently reviewed, then merged. Failures stay on the same PR.</desc>
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f3f46"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4ade80"/>
    </marker>
  </defs>
  <rect width="1100" height="300" rx="16" fill="#111114"/>
  <path d="M90 92 H1010" stroke="url(#rail)" stroke-width="2" fill="none"/>
  <g font-family="Instrument Sans, Noto Sans SC, sans-serif" font-size="13" fill="#f4f4f5">
    <g transform="translate(40,48)">
      <rect width="150" height="88" rx="12" fill="#09090b" stroke="rgba(255,255,255,.12)"/>
      <text x="16" y="28" fill="#4ade80" font-size="11" font-family="IBM Plex Mono, monospace">01</text>
      <text x="16" y="52" font-size="16" font-weight="600">Issue</text>
      <text x="16" y="74" fill="#a1a1aa">ai-ready label</text>
    </g>
    <g transform="translate(250,48)">
      <rect width="150" height="88" rx="12" fill="#09090b" stroke="rgba(255,255,255,.12)"/>
      <text x="16" y="28" fill="#4ade80" font-size="11" font-family="IBM Plex Mono, monospace">02</text>
      <text x="16" y="52" font-size="16" font-weight="600">Worktree</text>
      <text x="16" y="74" fill="#a1a1aa">isolated branch</text>
    </g>
    <g transform="translate(460,48)">
      <rect width="150" height="88" rx="12" fill="#09090b" stroke="rgba(255,255,255,.12)"/>
      <text x="16" y="28" fill="#4ade80" font-size="11" font-family="IBM Plex Mono, monospace">03</text>
      <text x="16" y="52" font-size="16" font-weight="600">Tests</text>
      <text x="16" y="74" fill="#a1a1aa">100% coverage</text>
    </g>
    <g transform="translate(670,48)">
      <rect width="150" height="88" rx="12" fill="#09090b" stroke="rgba(255,255,255,.12)"/>
      <text x="16" y="28" fill="#4ade80" font-size="11" font-family="IBM Plex Mono, monospace">04</text>
      <text x="16" y="52" font-size="16" font-weight="600">Review</text>
      <text x="16" y="74" fill="#a1a1aa">new session, can fix</text>
    </g>
    <g transform="translate(880,48)">
      <rect width="150" height="88" rx="12" fill="#09090b" stroke="#4ade80"/>
      <text x="16" y="28" fill="#4ade80" font-size="11" font-family="IBM Plex Mono, monospace">05</text>
      <text x="16" y="52" font-size="16" font-weight="600">Merge</text>
      <text x="16" y="74" fill="#a1a1aa">exact reviewed SHA</text>
    </g>
  </g>
  <path d="M955 136 C955 200, 145 200, 145 136" fill="none" stroke="rgba(74,222,128,.45)" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr)"/>
  <text x="550" y="214" text-anchor="middle" fill="#a1a1aa" font-size="13" font-family="Instrument Sans, sans-serif">Fail → same PR. Next tick continues. No replacement ticket.</text>
  <g font-family="IBM Plex Mono, monospace" font-size="11" fill="#a1a1aa">
    <text x="40" y="262">ai-ready</text>
    <text x="160" y="262">→</text>
    <text x="190" y="262">in-progress</text>
    <text x="310" y="262">→</text>
    <text x="340" y="262">pr-opened</text>
    <text x="450" y="262">→</text>
    <text x="480" y="262" fill="#4ade80">merged</text>
    <text x="560" y="262"> / </text>
    <text x="590" y="262">fix-needed ↺</text>
  </g>
</svg>
