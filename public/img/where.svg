<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 200" role="img" aria-labelledby="t">
  <title id="t">Work stays on your machine. State stays on GitHub.</title>
  <rect width="1100" height="200" rx="16" fill="#111114"/>
  <g font-family="Instrument Sans, Noto Sans SC, sans-serif" fill="#f4f4f5">
    <g transform="translate(70,40)">
      <rect width="280" height="120" rx="14" fill="#09090b" stroke="rgba(255,255,255,.12)"/>
      <rect x="28" y="28" width="54" height="36" rx="6" fill="#18181b" stroke="#3f3f46"/>
      <rect x="36" y="72" width="38" height="6" rx="2" fill="#3f3f46"/>
      <text x="100" y="52" font-size="16" font-weight="600">Your machine</text>
      <text x="100" y="76" fill="#a1a1aa" font-size="13">GPU · BYOK · systemd</text>
    </g>
    <g transform="translate(410,40)">
      <rect width="280" height="120" rx="14" fill="#09090b" stroke="#4ade80"/>
      <circle cx="52" cy="60" r="18" fill="none" stroke="#4ade80" stroke-width="2"/>
      <path d="M44 60 L50 66 L62 52" fill="none" stroke="#4ade80" stroke-width="2"/>
      <text x="86" y="52" font-size="16" font-weight="600">Orbi runner</text>
      <text x="86" y="76" fill="#a1a1aa" font-size="13">claim · review · merge</text>
    </g>
    <g transform="translate(750,40)">
      <rect width="280" height="120" rx="14" fill="#09090b" stroke="rgba(255,255,255,.12)"/>
      <path d="M40 48 h40 v40 h-40 z" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
      <path d="M48 56 h24 M48 68 h16" stroke="#a1a1aa" stroke-width="1.5"/>
      <text x="100" y="52" font-size="16" font-weight="600">GitHub</text>
      <text x="100" y="76" fill="#a1a1aa" font-size="13">Issue · PR · labels</text>
    </g>
    <path d="M350 100 H410" stroke="#4ade80" stroke-width="2"/>
    <path d="M690 100 H750" stroke="#4ade80" stroke-width="2"/>
  </g>
</svg>
