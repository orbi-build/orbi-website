name = "orbi-website"
main = "src/worker.js"
compatibility_date = "2026-08-31"
account_id = "9d4b74d3dc4247dfcd4b3ca77869cbdf"
workers_dev = true

# The website only hands OAuth off to Cloud; Cloud owns state, sessions, and
# onboarding. The production control plane exists and is live-verified
# (orbi.build/api/healthz answers from orbi-cloud-control-plane; /api/login
# 302s to GitHub OAuth with the production GitHub App), so production
# configures CLOUD_LOGIN_URL and /cloud/login opens: it 302s to the control
# plane and the pages keep their shipped Cloud CTAs (Issue #96 — the #77
# fail-closed premise, "no production control plane", no longer holds).
# [env.beta] names its own verified Cloud endpoint below. The website defines
# its endpoints outside the cloud control plane's route prefixes —
# /cloud/login and /cloud/apply (Issue #76; see docs/cloud-endpoints.md).
# Visit attribution (Issue #228) reports HTML 200s to the cloud control
# plane's POST /api/internal/visit (delivered by orbi-cloud#716) with the
# shared secret as `Authorization: Bearer ${WEBSITE_SECRET}` — the secret is
# never in the repo: `wrangler secret put WEBSITE_SECRET` (plus `--env beta`
# for the beta Worker), same value on the cloud side.
#
# That report travels over the CLOUD service binding below, NOT a plain
# fetch() of the URL (Issue #231). Both Workers answer on one hostname
# (website orbi.build/*, cloud orbi.build/api*), and a Worker's own fetch()
# of its zone is "routed to the zone's origin server, ignoring any Workers
# mapped to the URL" — so the report never reached the cloud Worker and
# died on the 5s timeout. CLOUD_VISIT_URL stays as the path the binding
# requests; only the transport changed.
vars = { CLOUD_LOGIN_URL = "https://orbi.build/api/login", CLOUD_VISIT_URL = "https://orbi.build/api/internal/visit" }


# Static landing files; every request hits the Worker first (www → apex, headers).
assets = { directory = "./public/", binding = "ASSETS", run_worker_first = true }

# Worker-to-Worker transport for the visit report (Issue #231): a plain
# fetch() of our own zone is routed to the origin server past every Worker,
# so the report never reached the control plane. Must stay AFTER every
# top-level key — a [[table]] header ends the top-level section in TOML.
[[services]]
binding = "CLOUD"
service = "orbi-cloud-control-plane"

[[routes]]
pattern = "orbi.build"
custom_domain = true

[[routes]]
pattern = "www.orbi.build"
custom_domain = true

[[routes]]
pattern = "aiready.sh"
custom_domain = true

[[d1_databases]]
binding = "orbi_applications"
database_name = "orbi-applications"
database_id = "9df2048e-004e-48e1-b81e-16826bd49d8a"

# Read-only queries in /stats expose the current Founding availability and
# public GitHub logins from the Cloud control plane's production data.
[[d1_databases]]
binding = "CONTROL_PLANE_DB"
database_name = "orbi_control_plane"
database_id = "f43377a6-3c1b-41d3-9018-3339590915ab"

# Durable bot behavior must read the same visitor_events database that the
# environment's CLOUD service writes: production here, isolated e2e on beta.
[[d1_databases]]
binding = "VISITOR_EVENTS_DB"
database_name = "orbi_control_plane"
database_id = "f43377a6-3c1b-41d3-9018-3339590915ab"

# Must stay last: every key after a table header belongs to that table, so
# putting this above `assets` swallows it and env.ASSETS becomes undefined.
[observability]
enabled = true
head_sampling_rate = 1

# Beta is an isolated Worker environment. Production routes above remain
# unchanged when deploying with `wrangler deploy --env beta`.
[env.beta]
name = "orbi-website-beta"
vars = { CLOUD_LOGIN_URL = "https://beta.orbi.build/api/login", CLOUD_VISIT_URL = "https://beta.orbi.build/api/internal/visit" }

# Keep a deploy target so routine releases update the Worker used by the
# existing beta Custom Domain, without managing that domain or its DNS.
workers_dev = false
# Route through the existing proxied DNS record without asking Wrangler to
# create/manage a Custom Domain (which would conflict with that record).
# Beta binds the e2e control plane (the Worker on beta.orbi.build/api*).
# Same TOML rule as the production binding above: after the env's plain keys.
[[env.beta.services]]
binding = "CLOUD"
service = "orbi-cloud-control-plane-e2e"

[[env.beta.routes]]
pattern = "beta.orbi.build/*"
custom_domain = false
zone_name = "orbi.build"

# beta.orbi.build's DNS record is existing infrastructure; this ordinary
# Worker route only selects the beta Worker for that hostname.
[[env.beta.d1_databases]]
binding = "orbi_applications"
database_name = "orbi-applications-test"
database_id = "3c254d65-e5c6-4488-9b83-dabc3433f092"

# Availability/social proof must reflect the real cohort on beta as well as
# production; this binding is only used by SELECT statements in /stats.
[[env.beta.d1_databases]]
binding = "CONTROL_PLANE_DB"
database_name = "orbi_control_plane"
database_id = "f43377a6-3c1b-41d3-9018-3339590915ab"

[[env.beta.d1_databases]]
binding = "VISITOR_EVENTS_DB"
database_name = "orbi_control_plane_e2e"
database_id = "4c9d878f-f4cc-472a-b324-b6a32da9b159"
