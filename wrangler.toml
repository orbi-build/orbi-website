name = "orbi-website"
main = "src/worker.js"
compatibility_date = "2026-08-31"
account_id = "9d4b74d3dc4247dfcd4b3ca77869cbdf"
workers_dev = true

# Static landing files; every request hits the Worker first (www → apex, headers).
assets = { directory = "./public/", binding = "ASSETS", run_worker_first = true }

[[routes]]
pattern = "orbi.build"
custom_domain = true

[[routes]]
pattern = "www.orbi.build"
custom_domain = true

[[d1_databases]]
binding = "orbi_applications"
database_name = "orbi-applications"
database_id = "9df2048e-004e-48e1-b81e-16826bd49d8a"

# Must stay last: every key after a table header belongs to that table, so
# putting this above `assets` swallows it and env.ASSETS becomes undefined.
[observability]
enabled = true
head_sampling_rate = 1

# Beta is an isolated Worker environment. Production routes above remain
# unchanged when deploying with `wrangler deploy --env beta`.
[env.beta]
name = "orbi-website-beta"
# Keep a deploy target so routine releases update the Worker used by the
# existing beta Custom Domain, without managing that domain or its DNS.
workers_dev = true
# Prevent production custom-domain routes from being inherited by beta.
routes = []

# beta.orbi.build is an existing Custom Domain. Keep its binding in Cloudflare;
# routine deploys must only publish this Worker and its assets.
[[env.beta.d1_databases]]
binding = "orbi_applications"
database_name = "orbi-applications-test"
database_id = "3c254d65-e5c6-4488-9b83-dabc3433f092"
