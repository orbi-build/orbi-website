name = "orbi-website"
main = "src/worker.js"
compatibility_date = "2026-08-31"
account_id = "9d4b74d3dc4247dfcd4b3ca77869cbdf"
workers_dev = true

# The website only hands OAuth off to Cloud; Cloud owns state, sessions, and
# onboarding. The production control plane exists and is live-verified
# (orbi.build/api/healthz answers from orbi-cloud-control-plane; /api/login
# 302s to GitHub OAuth with the production GitHub App), so production
# configures CLOUD_LOGIN_URL and /cloud/login opens: it 302s to the control
# plane and the pages keep their shipped Cloud CTAs (Issue #96 — the #77
# fail-closed premise, "no production control plane", no longer holds).
# [env.beta] names its own verified Cloud endpoint below. The website defines
# its endpoints outside the cloud control plane's route prefixes —
# /cloud/login and /cloud/apply (Issue #76; see docs/cloud-endpoints.md).
vars = { CLOUD_LOGIN_URL = "https://orbi.build/api/login" }

# Static landing files; every request hits the Worker first (www → apex, headers).
assets = { directory = "./public/", binding = "ASSETS", run_worker_first = true }

[[routes]]
pattern = "orbi.build"
custom_domain = true

[[routes]]
pattern = "www.orbi.build"
custom_domain = true

[[routes]]
pattern = "aiready.sh"
custom_domain = true

[[d1_databases]]
binding = "orbi_applications"
database_name = "orbi-applications"
database_id = "9df2048e-004e-48e1-b81e-16826bd49d8a"

# Must stay last: every key after a table header belongs to that table, so
# putting this above `assets` swallows it and env.ASSETS becomes undefined.
[observability]
enabled = true
head_sampling_rate = 1

# Beta is an isolated Worker environment. Production routes above remain
# unchanged when deploying with `wrangler deploy --env beta`.
[env.beta]
name = "orbi-website-beta"
vars = { CLOUD_LOGIN_URL = "https://beta.orbi.build/api/login" }
# Keep a deploy target so routine releases update the Worker used by the
# existing beta Custom Domain, without managing that domain or its DNS.
workers_dev = false
# Route through the existing proxied DNS record without asking Wrangler to
# create/manage a Custom Domain (which would conflict with that record).
[[env.beta.routes]]
pattern = "beta.orbi.build/*"
custom_domain = false
zone_name = "orbi.build"

# beta.orbi.build's DNS record is existing infrastructure; this ordinary
# Worker route only selects the beta Worker for that hostname.
[[env.beta.d1_databases]]
binding = "orbi_applications"
database_name = "orbi-applications-test"
database_id = "3c254d65-e5c6-4488-9b83-dabc3433f092"

# Issue #220: orbi-probe, a second Worker defined by this same file —
# `wrangler deploy --env probe` publishes it next to the site Worker without
# touching that Worker. It cron-probes the public URLs every three minutes
# (src/probe.js), writes one Analytics Engine data point per URL per run, and
# alerts Telegram once a URL has failed two consecutive runs. main, routes and
# workers_dev are per-environment overrides here: src/probe.js and no ingress
# at all (routes = [] keeps the production custom domains above from being
# attached to this Worker) — the probe only ever runs from its cron trigger.
[env.probe]
name = "orbi-probe"
main = "src/probe.js"
workers_dev = false
routes = []

[env.probe.triggers]
crons = ["*/3 * * * *"]

# Result history (acceptance: queryable by SQL). The dataset is created
# automatically on the first write; query it through the SQL API — see README.
[[env.probe.analytics_engine_datasets]]
binding = "PROBE_RESULTS"
dataset = "orbi_probe_results"

# One key per URL holding the consecutive-failure streak, so each transition
# alerts exactly once (flap suppression). KV, not an Analytics Engine query:
# reading AE would need a new Cloudflare API token secret, while KV is one
# binding the cron alone writes and reads.
[[env.probe.kv_namespaces]]
binding = "PROBE_STATE"
id = "6196879c92434ed79f4d13130b76f9b3"
